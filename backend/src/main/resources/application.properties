spring.application.name=ai-football-analysis
# Support IDE working directories at repository root or backend/.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:football_ai}
spring.datasource.username=${POSTGRES_USER:football_ai}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.paths-to-match=/api/**
